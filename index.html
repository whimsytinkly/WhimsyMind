<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Whimsy Mind</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/app.css">

</head>

<body>


    <!-- ================================ -->
    <!-- Main -->
    <!-- ================================ -->

    <main class="app-main">

        <div class="game-container">

            <!-- ================================ -->
            <!-- Game Header -->
            <!-- ================================ -->

            <header class="game-header">

                <h1>WhimsyMind</h1>
                <p>Daily Mastermind</p>

            </header>


            <!-- ================================ -->
            <!-- Game Board -->
            <!-- ================================ -->

            <section class="game-board">

                <!-- Game board goes here -->
                <div class="game-content">

                    <!-- Guess History -->
                    <section class="guess-history">

                        <!-- Guess rows go here -->
                        <h2>Guess History</h2>

                        <div class="guess-rows">
                            <!-- Guess rows will go here -->
                            <div class="guess-list" id="guessList">

                                <!-- Guess rows generated by JavaScript -->

                            </div>
                        </div>
                    </section>


                    <!-- Game Controls -->
                    <section class="game-controls">

                        <!-- Colour picker goes here -->
                        <div class="colour-picker">
                            <h3>Choose a colour</h3>

                            <!-- Colour buttons will go here -->
                            <div class="colour-options" id="colourOptions">
                                <!-- Colour options generated by JavaScript -->
                            </div>
                        </div>
                        <div class="game-actions">
                            <button class="button button-secondary button-medium" id="clearGuess" type="button">
                                Clear
                            </button>

                            <button class="button button-primary button-medium" id="submitGuess" type="button" disabled>
                                Submit
                            </button>
                        </div>

                    </section>

                </div>
            </section>

        </div>

    </main>


    <!-- ================================ -->
    <!-- Whimsy -->
    <!-- ================================ -->

    <script src="js/base.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
